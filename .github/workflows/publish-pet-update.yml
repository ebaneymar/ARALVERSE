name: Build and publish easier object selection 1.5.90

on:
  push:
    branches: [main]
    paths:
      - src/pet-feeding.html
      - src/layout-editor-1587.js
      - tools/test_independent_layout.cjs
      - src/pet-feeding.js
      - src/pet-feeding.css
      - src/pet-fonts.js
      - src/single-player-questions.js
      - src/assets/**
      - tools/build_pet_style_update.py
      - tools/stage_pet_windows.py
      - tools/test_pet_feeding.cjs
      - tools/test_pet_windows.cjs
      - .github/workflows/publish-pet-update.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: aralverse-pet-feeding-1-5-90
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ARALVERSE_Update_1.5.82.zip
            /src/
            /tools/
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build update and verify preserved licensing
        run: |
          python3 tools/build_pet_style_update.py --output .build/pet-release
          python3 tools/stage_pet_windows.py .build/pet-release .build/pet-preview
          node tools/test_activation_engine.cjs
          node tools/test_activation_desktop.cjs .build/pet-preview/app
      - name: Prepare browser verification
        run: |
          npm ci --prefix tools/windows --ignore-scripts --no-audit --no-fund
          node tools/windows/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify feeding, growth, characters, imported questions, and activation
        env:
          ARALVERSE_PLAYWRIGHT: ./windows/node_modules/playwright
          ARALVERSE_PET_SCREENSHOT: .build/pet-qa
        run: node tools/test_pet_feeding.cjs .build/pet-preview/app
      - name: Verify independent object editing and saved layouts
        env:
          ARALVERSE_PLAYWRIGHT: ./windows/node_modules/playwright
        run: node tools/test_independent_layout.cjs .build/pet-preview/app
      - name: Verify existing activation and layouts
        env:
          ARALVERSE_PLAYWRIGHT: ./windows/node_modules/playwright
        run: |
          node tools/test_activation_ui.cjs .build/pet-preview/app
          ARALVERSE_LICENSE_FIXTURE=trial node tools/test_layout_update.cjs .build/pet-preview/app
      - uses: actions/upload-artifact@v4
        with:
          name: pet-update-1.5.90
          compression-level: 0
          path: |
            .build/pet-release/ARALVERSE_Update_1.5.90.zip
            .build/pet-release/update-manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pet-ui-review
          path: .build/pet-qa*.png
          if-no-files-found: ignore
  windows:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: pet-update-1.5.90
          path: .build/pet-release
      - name: Stage the verified update and build Windows downloads
        run: |
          python tools/stage_pet_windows.py .build/pet-release .build/pet-windows
          npm ci --prefix tools/windows --no-audit --no-fund
          node tools/windows/build.cjs .build/pet-windows
          python tools/finish_windows_release.py .build/pet-windows
      - name: Verify actual installed and portable EXEs
        run: |
          node tools/windows/test-release.cjs .build/pet-windows
          node tools/test_pet_windows.cjs .build/pet-windows
      - uses: actions/upload-artifact@v4
        with:
          name: pet-windows-1.5.90
          compression-level: 0
          path: |
            .build/pet-windows/dist/ARALVERSE_Setup_1.5.90_x64.exe
            .build/pet-windows/dist/ARALVERSE_Windows_1.5.90_x64.zip
            .build/pet-windows/dist/SHA256SUMS.txt
            .build/pet-windows/dist/WINDOWS_README.txt
  publish:
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /update-manifest.json
      - uses: actions/download-artifact@v4
        with:
          name: pet-update-1.5.90
          path: .build/release
      - uses: actions/download-artifact@v4
        with:
          name: pet-windows-1.5.90
          path: .build/release
      - name: Publish verified update and matching manifest
        run: |
          git fetch origin main
          git checkout --detach origin/main
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shutil,subprocess
          root=pathlib.Path('.build/release');new=json.loads((root/'update-manifest.json').read_text());old=json.loads(pathlib.Path('update-manifest.json').read_text())
          assert old['version']=='1.5.89' or (old['version']==new['version'] and old['sha256']==new['sha256']), 'Review a newer published update before replacing it.'
          if old['version']=='1.5.89':
              assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['GITHUB_SHA'], 'Source changed during verification. Build from the current source before publishing.'
          package=root/'ARALVERSE_Update_1.5.90.zip';assert hashlib.sha256(package.read_bytes()).hexdigest()==new['sha256'] and package.stat().st_size==new['size']
          shutil.copyfile(package,package.name);shutil.copyfile(root/'update-manifest.json','update-manifest.json')
          names=['ARALVERSE_Setup_1.5.90_x64.exe','ARALVERSE_Windows_1.5.90_x64.zip','ARALVERSE_Update_1.5.90.zip','update-manifest.json','WINDOWS_README.txt']
          (root/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256((root/n).read_bytes()).hexdigest()+'  '+n+'\n' for n in names))
          (root/'RELEASE_NOTES.md').write_text('LAYOUT now has Pick object to clear the panel while selecting, hover outlines with object names, larger resize handles, and Alt-click for overlapping objects. A click or small hand movement no longer changes the layout. The panel reopens away from the picked object. Removed the idle answer instruction, shortcut hints, and score footer from Pakainin ang mga Alaga. LAYOUT now includes Hide object / Show object, Delete-to-hide, Undo, and saved visibility. Hidden objects remain available in the object list for restoring. Move or resize one object without pushing nearby objects. The scene background, character, pet, food bowl, and question-box background are separate editable layers. Text and answer-button resizing preserve their original space. Undo/Redo, Reset, Save, and Cancel are retained. Its artwork now sits in the same standard thumbnail and card layout as the other modes. The illustrated activity scene is retained. Feed the puppy with a blue food bowl; it becomes happy and grows after correct answers. FONT opens saved controls for font family, title/question/answer/label sizes, boldness, and text color, with preview, Cancel, and Default. A/B/C choose the left/middle/right answer, and Enter advances or retries a question, including when focus is on the launcher.\n\nExcel/CSV question importing is available in both Classic Adventure and the new activity. Existing modes, classroom saves, questions, layouts, device trial, and activation are retained.\n\nExisting v1.5.89 users: Check for Updates inside ARALVERSE. New Windows 10/11 x64 users: download the Setup EXE, or extract the complete portable ZIP. Back up the Data folder before replacing a copy with saved classroom progress.\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -- ARALVERSE_Update_1.5.90.zip update-manifest.json
          if ! git diff --cached --quiet; then git commit -m 'Publish ARALVERSE v1.5.90 with easier object selection'; git push origin HEAD:main; fi
      - name: Publish complete Windows downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=(.build/release/ARALVERSE_Setup_1.5.90_x64.exe .build/release/ARALVERSE_Windows_1.5.90_x64.zip .build/release/ARALVERSE_Update_1.5.90.zip .build/release/update-manifest.json .build/release/SHA256SUMS.txt .build/release/WINDOWS_README.txt)
          if gh release view v1.5.90 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.5.90 "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.5.90 "${files[@]}" --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" --title 'ARALVERSE 1.5.90 - Easier Object Selection' --notes-file .build/release/RELEASE_NOTES.md --draft
          fi
          gh release edit v1.5.90 --repo "$GITHUB_REPOSITORY" --draft=false --latest --notes-file .build/release/RELEASE_NOTES.md
